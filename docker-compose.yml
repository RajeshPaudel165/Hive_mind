services:
  hive-backend:
    build:
      context: ./backend
    container_name: hive-backend
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - ./backend/.env
    environment:
      HIVE_RUNTIME_MODE: local
      HIVE_AUTH_REQUIRED: ${HIVE_AUTH_REQUIRED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      HIVE_STATE_PATH: /app/data/hive_state.json
      HIVE_MEMPALACE_PATH: /app/data/mempalace
      HIVE_OPENCLAW_BOOTSTRAP_STATUS: deferred
      OPENCLAW_URL: http://host.docker.internal:18789/v1/chat/completions
      OPENCLAW_HEALTH_URL: http://host.docker.internal:18789/
    volumes:
      - hive_backend_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  hive_backend_data:
